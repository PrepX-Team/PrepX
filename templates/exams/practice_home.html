{% extends 'base.html' %}

{% block content %}
<h4>Practice — Select Subject</h4>

<div class="row g-3">
    {% for s in subjects %}
    <div class="col-md-4">
        <div class="card card-stat p-3">
            <h5>{{ s.name }}</h5>

            <a href="{% url 'practice_topics' s.id %}"
               class="btn btn-outline-primary btn-sm">
                Select
            </a>
        </div>
    </div>
    {% empty %}
    <p class="text-secondary">
        No practice subjects are available yet.
    </p>
    {% endfor %}
</div>
{% endblock %}
