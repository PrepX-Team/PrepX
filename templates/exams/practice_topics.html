{% extends 'base.html' %}

{% block content %}
<h4>{{ subject.name }} — Select Topic</h4>

<div class="row g-3">
    {% for t in topics %}
    <div class="col-md-4">
        <div class="card card-stat p-3">
            <h5>{{ t.name }}</h5>

            <a href="{% url 'practice_tests' t.id %}"
               class="btn btn-outline-primary btn-sm">
                Select
            </a>
        </div>
    </div>
    {% empty %}
    <p class="text-secondary">
        No topics are available for this subject.
    </p>
    {% endfor %}
</div>
{% endblock %}
