{% extends 'base.html' %}

{% block content %}

<div class="card auth-card shadow-sm">

    <div class="card-body p-4">

        <h4 class="mb-4">
            Edit Profile
        </h4>

        <form method="post">

            {% csrf_token %}

            {{ form.non_field_errors }}

            {% for field in form %}

                <div class="mb-3">

                    <label class="form-label">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.errors %}
                        <div class="text-danger small mt-1">
                            {{ field.errors }}
                        </div>
                    {% endif %}

                </div>

            {% endfor %}


            <div class="d-flex gap-2">

                <button
                    class="btn btn-primary"
                    type="submit"
                >
                    Save Changes
                </button>

                <a
                    href="{% url 'profile' %}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
