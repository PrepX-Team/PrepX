{% extends 'base.html' %}

{% block title %} - Join Exam{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h3 class="mb-2">
                        Join Exam
                    </h3>

                    <p class="text-muted">
                        Enter the exam key provided by your teacher.
                    </p>

                    <form method="post">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label
                                for="exam_key"
                                class="form-label"
                            >
                                Exam Key
                            </label>

                            <input
                                type="text"
                                name="exam_key"
                                id="exam_key"
                                class="form-control text-uppercase"
                                placeholder="Enter exam key"
                                maxlength="20"
                                autocomplete="off"
                                required
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Join Exam
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
