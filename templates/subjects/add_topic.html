{% extends 'base.html' %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-body">

        <h4 class="mb-4">Add Topic</h4>

        <form method="post">
            {% csrf_token %}

            {{ form.non_field_errors }}

            {{ form.as_p }}

            <div class="mt-3">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i>
                    Save Topic
                </button>

                <a href="{% url 'subject_list' %}"
                   class="btn btn-outline-secondary">
                    Cancel
                </a>
            </div>
        </form>

    </div>
</div>

{% endblock %}
