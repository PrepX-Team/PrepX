{% extends 'base.html' %}

{% block content %}

<div class="card card-stat">

    <div class="card-body">

        <h4 class="mb-4">
            {% if editing %}
                Edit Subject
            {% else %}
                Add Subject
            {% endif %}
        </h4>

        <form method="post">

            {% csrf_token %}

            {{ form.non_field_errors }}

            <div class="mb-3">

                <label class="form-label">
                    Subject Name
                </label>

                {{ form.name }}

                {% if form.name.errors %}
                    <div class="text-danger small mt-1">
                        {{ form.name.errors }}
                    </div>
                {% endif %}

            </div>

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle"></i>

                {% if editing %}
                    Update Subject
                {% else %}
                    Save Subject
                {% endif %}
            </button>

            <a href="{% url 'subject_list' %}" class="btn btn-outline-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
