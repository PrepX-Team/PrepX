{% extends 'base.html' %}

{% block content %}

<h4>
    Welcome, {{ user.first_name|default:user.username }}
</h4>

<div class="row mt-3 g-3">

    <div class="col-md-3">
        <div class="card card-stat p-3 text-center">
            <h3>{{ tests_attempted }}</h3>
            <small>Tests Attempted</small>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card card-stat p-3 text-center">
            <h3>{{ average_score }}</h3>
            <small>Average Score</small>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card card-stat p-3 text-center">
            <h3>{{ topics_started }}</h3>
            <small>Topics Started</small>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card card-stat p-3 text-center">
            <h3>{{ certificates_earned }}</h3>
            <small>Certificates</small>
        </div>
    </div>

</div>

{% endblock %}
